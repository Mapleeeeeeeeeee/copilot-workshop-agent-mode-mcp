<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-card">
    <header class="app-header">
      <p class="eyebrow">今日整理</p>
      <div class="title-row">
        <h1>我的待辦清單</h1>
        <button id="theme-toggle" class="theme-toggle" type="button"></button>
      </div>
      <p class="subtitle">把想做的事，一件一件完成。</p>
    </header>

    <!-- 新增待辦事項的表單。 -->
    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">待辦事項內容</label>
      <input id="todo-input" class="todo-input" type="text" maxlength="120" placeholder="接下來要做什麼？">
      <button class="add-button" type="submit">新增</button>
    </form>

    <!-- 切換目前要顯示的待辦事項範圍。 -->
    <div class="filter-bar" aria-label="待辦事項篩選">
      <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <!-- 待辦清單由 app.js 動態產生。 -->
    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    <p id="empty-state" class="empty-state">還沒有任何待辦事項,新增一個吧!</p>

    <footer class="app-footer">
      <div class="footer-content">
        <span id="remaining-count">未完成:0 項</span>
        <button id="clear-completed-button" class="clear-completed-button" type="button" disabled aria-label="清除所有已完成的待辦事項">清除已完成</button>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
